<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBP · Photo Agent</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="menubar"><span class="brand">IB<span>P</span></span><strong>PHOTO AGENT</strong><span class="divider"></span><label class="button" for="file">打开</label><button id="studio">Studio</button><button id="settings-open">API 设置</button><button id="training-open">训练</button><button id="papers-open">论文</button><div class="spacer"></div><span id="health" class="status">加载中</span><button id="quit" title="退出">退出</button><input id="file" type="file" hidden accept=".cr2,.cr3,.nef,.arw,.dng,.raf,.rw2,.orf,.pef,.srw,.jpg,.jpeg,.png,.tif,.tiff"></header>
<div class="optionbar"><span id="filename">未打开文档</span><div class="spacer"></div><div class="segmented"><button id="view-after" class="active">调整后</button><button id="view-before">原图</button><button id="view-compare">对比</button></div><button id="export" disabled>导出 TIFF</button></div>
<main><nav class="toolrail" aria-label="工作区"><label class="tool" for="file" title="打开照片">＋</label><button id="fit" class="tool selected" title="适应窗口">⌖</button><button id="compare-tool" class="tool" title="原图 / 调整后">◧</button><span class="spacer"></span><button id="data-open" class="tool" title="打开训练文件夹">▣</button></nav>
<section class="workarea"><div id="error" role="alert"></div><div class="document-tab"><span id="document-name">未命名</span><span id="dimensions"></span></div><div id="stage" class="stage"><div class="empty-mark" id="empty-before">IBP</div><div class="empty-mark" id="empty-after" hidden></div><figure id="before-figure" hidden><img id="before" alt="原图" hidden><figcaption>原图</figcaption></figure><figure id="after-figure"><img id="after" alt="调整后" hidden><figcaption id="outcome"></figcaption></figure></div>
<div class="reviewbar"><span>对本次生成的图片满意吗？</span><button id="satisfied" disabled>✓ 满意</button><button id="unsatisfied" disabled>× 不满意</button><span id="feedback-state" role="status"></span></div><div class="filmstrip" id="history"><button class="thumbnail add" id="add-photo" title="打开照片">＋</button></div><div class="document-status"><span id="phase">就绪</span><span id="summary"></span><div class="spacer"></div><div id="downloads"></div></div></section>
<aside class="panels"><section class="panel"><div class="panel-title">直方图 <span id="histogram-domain">RGB</span></div><canvas id="histogram" width="300" height="96" aria-label="图像直方图"></canvas></section>
<section class="panel adjust-panel"><div class="panel-title">调整<button id="reset" title="重置调节器" disabled>↺</button></div><div id="params" class="sliders"></div><button id="apply" class="wide" disabled>应用调整</button></section>
<section class="panel agent-panel"><div class="panel-title">Agent <span id="terms"></span></div><select id="role" aria-label="参数模型"><option value="student">Qwen · 本地学生</option><option value="teacher">API · 教师模型</option></select><textarea id="prompt" maxlength="1500" aria-label="自然语言修图命令" placeholder="输入修图命令…"></textarea><div class="agent-actions"><input id="group-id" maxlength="150" placeholder="拍摄组（可选）" aria-label="拍摄组"><button id="run" class="primary" disabled>生成 ↗</button></div></section></aside></main>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-title">API 设置<button type="button" data-close="settings-dialog" aria-label="关闭">×</button></div><fieldset><legend>教师</legend><label>URL<input id="teacher-url" type="url" required></label><label>模型<input id="teacher-model" required></label><label>API Key<input id="teacher-key" type="password" autocomplete="off"></label><label class="check"><input type="checkbox" id="teacher-clear">清除密钥</label></fieldset><fieldset><legend>学生</legend><label>URL<input id="student-url" type="url" placeholder="留空使用预置 Qwen"></label><label>模型<input id="student-model" required></label><label>API Key<input id="student-key" type="password" autocomplete="off"></label><label class="check"><input type="checkbox" id="student-clear">清除密钥</label></fieldset><div id="settings-error" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" data-close="settings-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="training-dialog"><div class="dialog-title">训练与权重<button data-close="training-dialog" aria-label="关闭">×</button></div><div class="counts"><span>满意 <b id="count-accepted">0</b></span><span>不满意 <b id="count-rejected">0</b></span><span>原图组 <b id="count-groups">0</b></span></div><label class="folder-field">样本目录<input id="dataset-path" readonly></label><div class="buttonrow"><button id="dataset-folder">打开文件夹</button><button id="dataset-export">导出训练集</button><button id="weights-folder">权重</button></div><hr><label class="folder-field">Qwen 训练基座<select id="training-model"><option value="Qwen/Qwen3-0.6B">Qwen3 · 0.6B</option><option value="Qwen/Qwen3-1.7B" disabled>Qwen3 · 1.7B · 外部 CUDA</option><option value="Qwen/Qwen3-4B" disabled>Qwen3 · 4B · 外部 CUDA</option></select></label><div class="buttonrow"><button id="prepare-qwen">准备 Qwen 环境</button><button id="train-qwen">训练 Qwen</button><button id="train-mlp" class="primary">训练 MLP</button><button id="cancel-training">停止</button></div><hr><div class="buttonrow"><select id="personal-weights" aria-label="个人权重"><option value="">预置模型</option></select><button id="activate-weights">启用权重</button><output id="personal-state"></output></div><output id="training-state">就绪</output><pre id="training-log"></pre></dialog>
<dialog id="papers-dialog" class="wide-dialog"><div class="dialog-title">论文检索<button data-close="papers-dialog" aria-label="关闭">×</button></div><span id="rag-status"></span><label class="button" for="paper-file">导入 PDF</label><input id="paper-file" type="file" accept=".pdf" hidden><form id="rag-form" class="rag-search"><input id="rag-query" type="search" maxlength="1500" placeholder="术语 / 研究问题" required aria-label="论文检索"><button id="rag-search" type="submit">检索</button></form><p id="rag-message" role="status"></p><div id="rag-results"></div><details id="job-evidence"><summary>本次引用</summary><div id="job-passages"></div></details></dialog>
<script src="/app.js"></script><script src="/rag.js"></script></body></html>
